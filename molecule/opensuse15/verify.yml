---
- name: Verify
  hosts: all
  become: false

  tasks:
    - name: Gather package facts
      ansible.builtin.package_facts:
        manager: rpm

    - name: Verify Puppet Agent package
      ansible.builtin.assert:
        that:
          - "'puppet-agent' in ansible_facts.packages"
        fail_msg: "puppet-agent package is not installed"

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Verify Puppet service
      ansible.builtin.assert:
        that:
          - "'puppet.service' in ansible_facts.services"
          - ansible_facts.services['puppet.service'].state == 'running'
          - ansible_facts.services['puppet.service'].status == 'enabled'
        fail_msg: "Puppet service is not running and enabled"

    - name: Check Puppet configuration directory
      ansible.builtin.stat:
        path: /etc/puppetlabs/puppet
      register: puppet_conf_dir

    - name: Verify Puppet configuration directory
      ansible.builtin.assert:
        that:
          - puppet_conf_dir.stat.exists
          - puppet_conf_dir.stat.isdir
        fail_msg: "Puppet configuration directory is missing"

    - name: Check puppet.conf
      ansible.builtin.stat:
        path: /etc/puppetlabs/puppet/puppet.conf
      register: puppet_conf

    - name: Verify puppet.conf
      ansible.builtin.assert:
        that:
          - puppet_conf.stat.exists
          - puppet_conf.stat.isreg
        fail_msg: "puppet.conf is missing"

    - name: Check Puppet executable
      ansible.builtin.stat:
        path: /opt/puppetlabs/bin/puppet
      register: puppet_binary

    - name: Verify Puppet executable
      ansible.builtin.assert:
        that:
          - puppet_binary.stat.exists
          - puppet_binary.stat.executable
        fail_msg: "Puppet executable is missing"

    - name: Check Puppet command symlink
      ansible.builtin.stat:
        path: /usr/local/bin/puppet
      register: puppet_symlink

    - name: Verify Puppet command symlink
      ansible.builtin.assert:
        that:
          - puppet_symlink.stat.exists
          - puppet_symlink.stat.islnk
          - puppet_symlink.stat.lnk_source == '/opt/puppetlabs/bin/puppet'
        fail_msg: "Puppet command symlink is incorrect"

    - name: Check Puppet version
      ansible.builtin.command:
        cmd: /opt/puppetlabs/bin/puppet --version
      register: puppet_version
      changed_when: false

    - name: Show Puppet version
      ansible.builtin.debug:
        msg: "Puppet version: {{ puppet_version.stdout }}"
