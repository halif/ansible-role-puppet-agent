---
name: CI

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Ansible tools
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core ansible-lint yamllint

      - name: Run yamllint
        run: yamllint -c .config/yamllint.yml .

      - name: Run ansible-lint
        run: ansible-lint -c .config/ansible-lint.yml .

  molecule:
    name: Molecule
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Molecule
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core molecule
          pip install molecule-plugins[docker]

      - name: Make role available to Ansible
        run: |
          mkdir -p ~/.ansible/roles
          ln -s "$GITHUB_WORKSPACE" ~/.ansible/roles/puppet_agent

      - name: Molecule syntax
        run: molecule syntax

      - name: Molecule create
        run: molecule create

      - name: Molecule converge
        id: molecule_converge
        continue-on-error: true
        run: molecule converge

      - name: Show Puppet Agent diagnostics
        if: steps.molecule_converge.outcome == 'failure'
        run: |
          echo "===== Docker containers ====="
          docker ps -a

          CONTAINER_ID=$(docker ps -aq --filter "name=puppet-agent")

          if [ -z "$CONTAINER_ID" ]; then
            echo "puppet-agent container not found"
            exit 1
          fi

          echo "===== systemctl status ====="
          docker exec "$CONTAINER_ID" \
            systemctl status puppet --no-pager || true

          echo "===== systemctl cat ====="
          docker exec "$CONTAINER_ID" \
            systemctl cat puppet || true

          echo "===== systemctl show ====="
          docker exec "$CONTAINER_ID" \
            systemctl show puppet \
            -p ExecStart \
            -p User \
            -p Group \
            -p Type \
            -p ActiveState \
            -p SubState \
            --no-pager || true

          echo "===== journalctl ====="
          docker exec "$CONTAINER_ID" \
            journalctl -u puppet.service \
            --no-pager \
            -n 100 || true

          echo "===== Puppet version ====="
          docker exec "$CONTAINER_ID" \
            /opt/puppetlabs/bin/puppet --version || true

          echo "===== Puppet config ====="
          docker exec "$CONTAINER_ID" \
            cat /etc/puppetlabs/puppet/puppet.conf || true

          echo "===== Puppet processes ====="
          docker exec "$CONTAINER_ID" \
            ps auxww | grep -E '[p]uppet' || true

      - name: Molecule verify
        if: steps.molecule_converge.outcome == 'success'
        run: molecule verify

      - name: Molecule destroy
        if: always()
        run: molecule destroy

      - name: Fail Molecule job
        if: steps.molecule_converge.outcome == 'failure'
        run: exit 1
