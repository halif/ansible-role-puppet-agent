---
name: CI

on:
  push:
    branches:
      - "**"

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Ansible tools
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core ansible-lint yamllint

      - name: Run yamllint
        run: yamllint -c .config/yamllint.yml .

      - name: Run ansible-lint
        run: ansible-lint -c .config/ansible-lint.yml .

  molecule:
    name: Molecule - ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: default
            container_name: puppet-agent

          - scenario: rocky9
            container_name: puppet-agent-rocky9

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Molecule
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core molecule
          pip install molecule-plugins[docker]

      - name: Make role available to Ansible
        run: |
          mkdir -p ~/.ansible/roles
          ln -s "$GITHUB_WORKSPACE" ~/.ansible/roles/puppet_agent

      - name: Molecule syntax
        run: molecule syntax --scenario "${{ matrix.scenario }}"

      - name: Molecule create
        run: molecule create --scenario "${{ matrix.scenario }}"

      - name: Molecule converge
        id: molecule_converge
        continue-on-error: true
        run: molecule converge --scenario "${{ matrix.scenario }}"

      - name: Show Molecule diagnostics
        if: steps.molecule_converge.outcome == 'failure'
        run: |
          echo "===== Docker containers ====="
          docker ps -a

          CONTAINER_ID=$(docker ps -aq --filter "name=${{ matrix.container_name }}")

          if [ -z "$CONTAINER_ID" ]; then
            echo "Container ${{ matrix.container_name }} not found"
            exit 1
          fi

          echo "===== Container inspect ====="
          docker inspect "$CONTAINER_ID" || true

          echo "===== Puppet service ====="
          docker exec "$CONTAINER_ID" \
            systemctl status puppet.service --no-pager || true

          echo "===== Puppet journal ====="
          docker exec "$CONTAINER_ID" \
            journalctl -u puppet.service \
            --no-pager \
            -n 100 || true

          echo "===== Puppet version ====="
          docker exec "$CONTAINER_ID" \
            /opt/puppetlabs/bin/puppet --version || true

          echo "===== Puppet configuration ====="
          docker exec "$CONTAINER_ID" \
            cat /etc/puppetlabs/puppet/puppet.conf || true

          echo "===== Puppet processes ====="
          docker exec "$CONTAINER_ID" \
            ps auxww | grep -E '[p]uppet' || true

      - name: Molecule verify
        if: steps.molecule_converge.outcome == 'success'
        run: molecule verify --scenario "${{ matrix.scenario }}"

      - name: Molecule destroy
        if: always()
        run: molecule destroy --scenario "${{ matrix.scenario }}"

      - name: Fail Molecule job
        if: steps.molecule_converge.outcome == 'failure'
        run: exit 1
