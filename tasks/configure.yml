---
- name: Ensure Puppet configuration directory exists
  ansible.builtin.file:
    path: "{{ puppet_conf_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure Puppet Agent puppet.conf
  ansible.builtin.template:
    src: puppet.conf.j2
    dest: "{{ puppet_conf_file }}"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Restart puppet agent
